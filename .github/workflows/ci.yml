# Automatische Tests fuer HUMig (Windows PowerShell 5.1) und Releases.
# - bei jedem Push/Pull-Request: Pruefungen (Syntax, XAML, Steuerelemente, Version, PSScriptAnalyzer, Pester) + Selbsttest
# - Push auf main mit neuer Version (Config/version.json, Tag existiert noch nicht):
#   Vorab-Release v<Version> (Kanal Test) automatisch anlegen, Text aus CHANGELOG.md, HUMig-files.sha256 anhaengen,
#   nur die letzten 10 Releases behalten (die freigegebene Version bleibt immer)
# - von Hand veroeffentlichtes Release: HUMig-files.sha256 anhaengen
# - danach jeweils den Update-Weg testen (Pull.ps1 laedt genau dieses Release und prueft alle Pruefsummen; zweiter Lauf = Update mit Journal/Aufraeumen)
# - Signatur + Freigabe macht der Herausgeber in HUMig (Rechtsklick auf Update > Release signieren / Release freigeben),
#   erst dann wird das Release den Installationen angeboten
name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

# neuer Push bricht einen noch laufenden Lauf desselben Branches ab
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruefungen (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - name: Pruefungen
        shell: powershell
        run: .\.github\tests\Invoke-CITests.ps1
      - name: Selbsttest (Test-HUMig.ps1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Test-HUMig.ps1
          $c = $LASTEXITCODE
          if (Test-Path .\Test-HUMig.result.txt) { Get-Content .\Test-HUMig.result.txt | Add-Content $env:GITHUB_STEP_SUMMARY }
          exit $c

  release:
    name: Release + Pruefsummen-Datei
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Release bestimmen bzw. als Vorab-Release anlegen
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(python3 -c "import json;print(json.load(open('Config/version.json',encoding='utf-8-sig'))['version'])")
          if [ -z "$V" ]; then echo "Version in Config/version.json nicht gefunden"; exit 1; fi
          T="v$V"
          if gh release view "$T" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $T gibt es schon - nichts anzulegen"; echo "tag=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Abschnitt "## v<Version>" aus CHANGELOG.md als Release-Text
          python3 - "$V" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          t = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## v' + re.escape(v) + r'\b[^\n]*\n(.*?)(?=^## v|\Z)', t, re.S | re.M)
          print(m.group(1).strip() if m else 'Version ' + v)
          PY
          gh release create "$T" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "$T" --notes-file notes.md
          echo "Vorab-Release $T angelegt" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
      - name: HUMig-files.sha256 erstellen und anhaengen
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          python3 .github/scripts/manifest.py HUMig-files.sha256
          gh release upload "$TAG" HUMig-files.sha256 --clobber --repo "$GITHUB_REPOSITORY"
      - name: Alte Releases entfernen (nur die letzten 10 behalten, Tags bleiben)
        if: github.event_name == 'push' && steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          # neueste zuerst; die aktuelle freigegebene Version (Latest) bleibt immer erhalten
          LATEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null || true)
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate -q '.[] | "\(.created_at) \(.tag_name)"' | sort -r | awk '{print $2}' > all.txt
          n=0
          while read -r T; do
            n=$((n+1))
            [ "$n" -le "$KEEP" ] && continue
            [ "$T" = "$LATEST" ] && { echo "behalte $T (Latest)"; continue; }
            gh release delete "$T" --repo "$GITHUB_REPOSITORY" --yes && echo "- geloescht: $T" >> "$GITHUB_STEP_SUMMARY"
          done < all.txt

  pull:
    name: Update-Weg testen (Pull.ps1)
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Pull.ps1 laedt das Release und prueft alle Pruefsummen
        shell: powershell
        env:
          HUMIG_GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $t = Join-Path $env:RUNNER_TEMP 'HUMig'
          $v = $env:TAG -replace '^v', ''
          # Die Signatur haengt der Herausgeber erst nach diesem Test an - hier wird der Weg mit Pruefsumme getestet
          New-Item -ItemType Directory -Path (Join-Path $t 'Config') -Force | Out-Null
          '{ "AllowUnsigned": true }' | Set-Content -LiteralPath (Join-Path $t 'Config\update.json') -Encoding UTF8
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Pull.ps1 -Target $t -Version $v -NoStart -NonInteractive -Owner $env:GITHUB_REPOSITORY_OWNER -Repo ($env:GITHUB_REPOSITORY -split '/')[1]
          if ($LASTEXITCODE -ne 0) { throw "Pull.ps1 Exitcode $LASTEXITCODE" }
          $i = Get-Content (Join-Path $t 'Config\installed.json') -Raw | ConvertFrom-Json
          if ("$($i.Version)" -ne $v) { throw "installiert: $($i.Version), erwartet $v" }
          if ("$($i.Check)" -notlike 'Pruefsumme*') { throw "nicht geprueft: $($i.Check)" }
          "Pull OK: $($i.Version) - $($i.Check) - $($i.Files) Dateien"
          # zweiter Lauf = Update ueber bestehende Installation:
          #   veraltete Programmdatei muss weg, Config und eigene Dateien bleiben, Pfade ausserhalb werden ignoriert,
          #   ein abgebrochenes Update (Journal) wird zuerst zurueckgestellt, danach keine Reste
          $old = Join-Path $t 'Functions\Alt-Entfernt.ps1'; 'alt' | Set-Content -LiteralPath $old -Encoding UTF8
          $keep = Join-Path $t 'Config\behalten.txt'; 'bleibt' | Set-Content -LiteralPath $keep -Encoding UTF8
          $own = Join-Path $t 'Functions\Eigene.ps1'; 'eigen' | Set-Content -LiteralPath $own -Encoding UTF8
          $outside = Join-Path $env:RUNNER_TEMP 'ausserhalb.txt'; 'aussen' | Set-Content -LiteralPath $outside -Encoding UTF8
          $i.FileList = @($i.FileList) + @('Functions/Alt-Entfernt.ps1', 'Config/behalten.txt', '../ausserhalb.txt')
          $i | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $t 'Config\installed.json') -Encoding UTF8
          # abgebrochenes Update mit ZWEI Dateien (ein einzelner Eintrag wuerde das Array-Verhalten von PS 5.1 verdecken)
          $main = Join-Path $t 'HUMig.ps1'
          $lib = Join-Path $t 'Functions\Core-Update.ps1'
          Move-Item -LiteralPath $main -Destination "$main.pullold"; 'kaputt' | Set-Content -LiteralPath $main -Encoding UTF8
          $libHash = (Get-FileHash -LiteralPath $lib -Algorithm SHA256).Hash
          Move-Item -LiteralPath $lib -Destination "$lib.pullold"
          ConvertTo-Json -InputObject @("$main", "$lib") | Set-Content -LiteralPath (Join-Path $t 'Config\pull-journal.json') -Encoding UTF8
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File .\Pull.ps1 -Target $t -Version $v -NoStart -NonInteractive -Owner $env:GITHUB_REPOSITORY_OWNER -Repo ($env:GITHUB_REPOSITORY -split '/')[1] 2>&1 | Out-String
          $c = $LASTEXITCODE
          $out
          if ($c -ne 0) { throw "Pull.ps1 (Update) Exitcode $c" }
          if ($out -notmatch 'abgebrochen') { throw 'Journal wurde nicht ausgewertet' }
          if ((Get-Content -LiteralPath $main -Raw) -match 'kaputt') { throw 'HUMig.ps1 nicht erneuert' }
          if ($out -notmatch [regex]::Escape("zurueckgestellt: $lib")) { throw 'Journal: Core-Update.ps1 nicht zurueckgestellt (Array-Auswertung PS 5.1?)' }
          if (-not (Test-Path -LiteralPath $lib) -or (Get-FileHash -LiteralPath $lib -Algorithm SHA256).Hash -ne $libHash) { throw 'Core-Update.ps1 fehlt oder falsch' }
          if (Test-Path -LiteralPath $old) { throw 'veraltete Datei nicht entfernt' }
          if (-not (Test-Path -LiteralPath $keep)) { throw 'Datei in Config wurde entfernt' }
          if (-not (Test-Path -LiteralPath $own)) { throw 'eigene Datei wurde entfernt' }
          if (-not (Test-Path -LiteralPath $outside)) { throw 'Datei ausserhalb wurde entfernt' }
          $rest = @(Get-ChildItem -LiteralPath $t -Recurse -File -Force | Where-Object { $_.Name -match '\.(pullold|pulltmp)$' -or $_.Name -eq 'pull-journal.json' })
          if ($rest.Count) { throw "Reste: $(($rest | ForEach-Object Name) -join ', ')" }
          $i = Get-Content (Join-Path $t 'Config\installed.json') -Raw | ConvertFrom-Json
          if ("$($i.Version)" -ne $v -or -not @($i.FileList).Count) { throw "installed.json nach Update falsch: $($i.Version)" }
          "Update OK: Journal zurueckgestellt, veraltete Datei entfernt, Config/eigene Dateien unberuehrt, keine Reste"
